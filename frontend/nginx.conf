# 知源前端：静态产物 + /api 反代到 backend 容器。
# 只有这一个容器对宿主暴露端口，backend:8000 与 db 都留在 compose 内网。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8m;      # 沉淀页正文可能较长（图片上传是 V1.1）
  gzip on;
  gzip_min_length 1k;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 后端：/api/v1 全部接口 + swagger + 健康检查。
  # 放在 location / 之前：正则 location 优先级高于前缀匹配，但写在前面更好读。
  location ~ ^/(api|docs|redoc|openapi\.json|healthz) {
    # 走 Docker 内嵌 DNS + 变量：写死 proxy_pass http://backend:8000 的话，nginx 只在启动时
    # 解析一次主机名，`docker compose up -d` 重建 backend（IP 变了）之后会一直 502，
    # 必须连 frontend 一起重启才好。用变量则每次请求按 valid=10s 重新解析。
    # 注意：proxy_pass 带变量时 URI 不会自动透传，必须显式拼 $request_uri（含 query）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $zy_backend http://backend:8000;
    proxy_pass $zy_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 必须 > 后端的 generation_timeout(60s)：/api/v1/ask 的生成实测 10–40s，
    # nginx 默认 proxy_read_timeout 是 60s，会抢在后端之前掐断，用户看到 504 而不是
    # 后端设计好的 503 AI_UNAVAILABLE —— M5 的降级语义就被毁掉了。别调小。
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # 带 hash 的构建产物可以长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # BrowserRouter：直接访问 /search 或刷新 /asset/KA-001 都要回 index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
