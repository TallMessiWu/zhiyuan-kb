/* ================= 混合检索评分 =================
   总分 = 关键词 + 语义 + 状态权重 + 版本/框架/模型匹配 + 新鲜度 + 复用证据
   STALE/ARCHIVED 默认不进入结果，仅“查看历史资产”开启后返回（不参与加权排序倾斜）。 */
function tokenize(q){
  return q.toLowerCase().split(/[\s,，、;；/]+/).filter(Boolean);
}
function scoreAsset(a, q, f){
  const terms = tokenize(q);
  const parts = [];
  let total = 0;

  // 1) 关键词匹配（字段加权）
  let kw = 0;
  const tl=a.title.toLowerCase(), sm=a.summary.toLowerCase(), tg=a.tags.join(" ").toLowerCase(), bd=bodyText(a).toLowerCase();
  terms.forEach(t=>{
    if(tl.includes(t)) kw+=4;
    if(tg.includes(t)) kw+=3;
    if(sm.includes(t)) kw+=2;
    else if(bd.includes(t)) kw+=1;
  });
  kw = Math.min(kw, 18);
  if(kw>0){ total+=kw; parts.push({l:"关键词",v:kw}); }

  // 2) 语义关联（同义词组 → 标签召回，模拟向量近邻）
  let sem = 0; const semHitGroups=[];
  const qLow = q.toLowerCase();
  SYN.forEach(g=>{
    const hitQ = g.group.some(w=>qLow.includes(w));
    if(!hitQ) return;
    const hitA = g.tags.some(t=>a.tags.map(x=>x.toLowerCase()).includes(t.toLowerCase()));
    if(hitA){ sem+=6; semHitGroups.push(g.group[0]); }
  });
  sem = Math.min(sem, 12);
  if(sem>0){ total+=sem; parts.push({l:"语义:"+semHitGroups.join("/"),v:sem}); }

  if(kw===0 && sem===0) return null; // 完全不相关

  // 3) 状态权重
  const stW = {VERIFIED:14, DRAFT:0, REVIEW_DUE:-10, STALE:0, ARCHIVED:0}[a.status];
  if(stW!==0){ total+=stW; parts.push({l:"状态 "+a.status.replace("_","-"),v:stW,cls:stW>0?"pos":"neg"}); }

  // 4) 筛选器 / 查询中的框架、模型匹配
  const fwQ = f.fw || (qLow.includes("sglang")?"sglang":(qLow.includes("ascend")||qLow.includes("vllm")?"vllm-ascend":""));
  if(fwQ){
    const m = a.framework.toLowerCase().includes(fwQ.toLowerCase()) || a.framework==="通用";
    total += m?6:-8; parts.push({l:"框架"+(m?"匹配":"不符"),v:m?6:-8,cls:m?"pos":"neg"});
  }
  if(f.model){
    const m = a.models.some(x=>x.includes(f.model)) || a.models.includes("通用");
    total += m?6:-8; parts.push({l:"模型"+(m?"匹配":"不符"),v:m?6:-8,cls:m?"pos":"neg"});
  }

  // 5) 新鲜度
  const d = daysAgo(a.updated);
  const fr = d<30?5:(d<90?3:(d<180?1:0));
  if(fr>0){ total+=fr; parts.push({l:"更新 "+fmtAgo(a.updated),v:fr}); }

  // 6) 复用证据
  const ru = Math.min(Math.round(a.reuseCount*0.4), 8);
  if(ru>0){ total+=ru; parts.push({l:"复用×"+a.reuseCount,v:ru}); }

  return {total:Math.round(total*10)/10, parts, terms};
}
function runSearch(f){
  const isHist = f.hist;
  let pool = ASSETS.filter(a=>{
    const dead = (a.status==="STALE"||a.status==="ARCHIVED");
    if(isHist ? !dead : dead) return false;
    if(f.type && a.type!==f.type) return false;
    if(f.status && a.status!==f.status) return false;
    return true;
  });
  const out=[];
  pool.forEach(a=>{
    const s = f.q ? scoreAsset(a,f.q,f) : {total:(a.status==="VERIFIED"?14:0)+Math.min(a.reuseCount*.4,8), parts:[{l:"无查询词：按状态+复用排序",v:0}], terms:[]};
    if(f.q && !s) return;
    if(!f.q){ // 无词浏览也应用框架/模型过滤
      if(f.fw && !(a.framework.toLowerCase().includes(f.fw)||a.framework==="通用")) return;
      if(f.model && !(a.models.some(x=>x.includes(f.model))||a.models.includes("通用"))) return;
    }
    out.push({a, s});
  });
  out.sort((x,y)=>y.s.total-x.s.total);
  return out;
}

  searchState.fw=$("#f-fw").value; searchState.status=$("#f-status").value;
  searchState.hist=$("#f-hist").checked;
  pushSearch();
}
function pushSearch(){
  const s=searchState, p=new URLSearchParams();
  if(s.q)p.set("q",s.q); if(s.type)p.set("type",s.type); if(s.model)p.set("model",s.model);
  if(s.fw)p.set("fw",s.fw); if(s.status)p.set("status",s.status); if(s.hist)p.set("hist","1");
  location.hash="#/search?"+p.toString();
}
function reportGap(){
  const q=searchState.q||"（无关键词浏览）";
  const ex=GAPS.find(g=>g.q.toLowerCase().includes(q.toLowerCase())&&q.length>1);
  if(ex){ ex.hits++; ex.last=TODAY; if(!ex.from.includes(ME))ex.from.push(ME); }
  else GAPS.unshift({id:"GAP-"+Math.floor(10+GAPS.length),q:"关于「"+q+"」的可用知识",hits:1,last:TODAY,from:[ME],claimed:false});
  toast(`已记录知识缺口：「${esc(q)}」<br>系统同时记下了你的搜索词与时间，形成需求事件。`);
}

let QA_LOG=[];
function renderAsk(){
  return `
  <div class="pagehead"><h1>AI 问答</h1><span class="sub">仅基于知识资产回答 · 引用来源与状态 · STALE 不参与结论 · 冲突并列展示</span></div>
  <form class="searchrow" onsubmit="askSubmit(event)">
    <input id="askq" type="search" placeholder="问一个推理问题，例如「DeepSeek MLA 有什么限制」…" autocomplete="off">
    <button class="btn pri" type="submit">提问</button>
  </form>
  <div class="preset-qs">
    ${QA_PRESETS.map((p,i)=>`<button onclick="askPreset(${i})">${esc(p.q)}</button>`).join("")}
  </div>
  <div id="qalog">${QA_LOG.join("")}</div>
  ${QA_LOG.length?"":`<div class="empty" style="margin-top:20px">回答规则：每个结论必须给出来源资产、命中段落、资产状态与适用版本；没有可靠依据时明确说「没有找到经过验证的知识」，不编造。</div>`}`;
}
function askPreset(i){ renderAnswer(QA_PRESETS[i].q, QA_PRESETS[i]); }
function askSubmit(e){
  e.preventDefault(); const q=$("#askq").value.trim(); if(!q)return;
  const qLow=q.toLowerCase();
  let best=null,bestN=0;
  QA_PRESETS.forEach(p=>{ const n=p.match.filter(k=>qLow.includes(k)).length; if(n>=p.minHit&&n>bestN){best=p;bestN=n;} });
  renderAnswer(q,best);
}
function citeBlock(c){
  const a=byId(c.asset);
  return `<div class="cite"><div class="ct-h">${pill(a.status)}<a href="#/asset/${a.id}"><b>${a.id}</b> ${esc(a.title)}</a></div>
  <div class="meta"><span>适用：<span class="mono">${esc(a.framework)} ${esc(a.fwVersion)}</span></span><span class="sep"></span><span>${a.models.join("/")}</span><span class="sep"></span><span>更新 ${fmtAgo(a.updated)}</span></div>
  ${c.frag?`<div class="frag">${c.frag}</div>`:""}</div>`;
}
let _qaQ="";
function renderAnswer(q, preset){
  _qaQ=q;
  let html=`<div class="qa-q">${esc(q)}</div><div class="qa-a">`;
  if(preset){
    const A=preset.answer;
    if(A.notFound){
      html+=`<div class="callout bad"><span class="ct">没有找到经过验证的知识</span>${A.conclusion}</div>
      <p><button class="btn sm" onclick="reportGapFromQA()">记录 / 累计为知识缺口</button></p>`;
    }else{
      html+=`<p>${A.conclusion}</p>`;
      if(A.conflict){
        html+=`<div class="callout warn"><span class="ct">多份资产结论冲突 —— 系统展示差异，不代为裁决</span>
        <b>说法 A：</b>${assetLink(A.conflict.a.asset)}<br><span style="color:var(--ink2)">${A.conflict.a.stand}</span><br>
        <b>说法 B：</b>${assetLink(A.conflict.b.asset)}<br><span style="color:var(--ink2)">${A.conflict.b.stand}</span></div>`;
      }
      (A.risks||[]).forEach(r=>{ html+=`<div class="callout ${r.type}"><span class="ct">${r.type==="bad"?"来源可信度警告":"可能过时提示"}</span>${r.text}</div>`; });
      if(A.cites.length){ html+=`<div style="font-size:11.5px;color:var(--ink3);margin-top:10px">来源（${A.cites.length}）：</div>`+A.cites.map(citeBlock).join(""); }
    }
  }else{
    const res=runSearch({q,type:"",model:"",fw:"",status:"",hist:false}).slice(0,3);
    if(!res.length){
      html+=`<div class="callout bad"><span class="ct">没有找到经过验证的知识</span>知识库中没有与该问题相关的资产。已可记录为知识缺口，供后续沉淀。</div>
      <p><button class="btn sm" onclick="reportGapFromQA()">记录为知识缺口</button></p>`;
    }else{
      html+=`<p>该问题没有命中预置的高置信回答。以下为按相关度检索到的资产，<b>系统未将其合成为确定性结论</b>，请打开来源核对适用版本与状态：</p>`;
      html+=res.map(r=>citeBlock({asset:r.a.id, frag:esc(r.a.summary)})).join("");
      if(res.some(r=>r.a.status==="REVIEW_DUE")) html+=`<div class="callout warn"><span class="ct">可能过时提示</span>以上来源中含 REVIEW-DUE 资产，其内容待复核，引用时请谨慎。</div>`;
    }
  }
  html+=`</div>`;
  QA_LOG.push(html); route();
}
function reportGapFromQA(){
  const q=_qaQ||"（未记录问题）";
  const ex=GAPS.find(g=>g.q.includes(q.slice(0,6)));
  if(ex){ex.hits++;ex.last=TODAY;if(!ex.from.includes(ME))ex.from.push(ME);}
  else GAPS.unshift({id:"GAP-"+Math.floor(10+GAPS.length),q,hits:1,last:TODAY,from:[ME],claimed:false});
  toast("已记录知识缺口，累计次数将影响其在首页的优先级。");
}

  return `
  <div class="pagehead"><h1>复核队列</h1><span class="sub">只列入「实际被使用 / 高风险 / 受代码或版本变化影响」的资产 —— DRAFT 躺着不动不会出现在这里</span></div>

    return `<div class="rev-item">

    </div>`;
  }).join(""):`<div class="empty">队列已清空。资产在关联代码 / 版本变化或收到「可能过时」反馈时会自动进入这里。</div>`}
  <div class="footnote">轮值提示：本周复核轮值 —— ${ME}。处理动作都会写入资产的验证与版本记录，作为审计轨迹。</div>`;
}
function revAct(id,act){
  const a=byId(id); const m=REVIEW_META[id]||{};
  if(act==="valid"){
    a.status="VERIFIED";
    a.validations.unshift({by:ME,date:TODAY,note:"复核确认：针对「"+(m.trigger||"变更")+"」核对后内容仍然有效",result:"通过"});
    a.statusReason="复核确认仍有效（"+TODAY+"，"+ME+"）。";
    toast(`${id} 复核通过 → 恢复 VERIFIED，验证记录已留痕。`);
  }else if(act==="accept"){
    const ver="v"+(a.history.length+2);
    a.history.unshift({ver,date:TODAY,by:ME+"（采纳 AI 草稿）",note:"按 AI 更新草稿修订："+(m.trigger||"")});
    a.updated=TODAY; a.status="DRAFT";
    a.statusReason="已按 AI 草稿更新为 "+ver+"，等待非作者复用后可重新升级 VERIFIED。";
    a.body.unshift({h:"【"+TODAY+" 更新 · 待验证】",p:esc(m.draft||"按 AI 草稿更新。")});
    toast(`${id} 已生成新版本 ${ver}（DRAFT · 尚未验证）。AI 草稿不会被自动标记为 VERIFIED。`);
  }else if(act==="stale"){
    a.status="STALE";
    a.statusReason="复核确认失效（"+TODAY+"，"+ME+"）：" + (m.triggerDetail||"内容不再适用。");
    a.validations.unshift({by:ME,date:TODAY,note:"复核确认失效",result:"失效确认"});
    toast(`${id} 已标记 STALE，退出正常搜索，仅历史入口可见。`);
  }else if(act==="arch"){
    a.status="ARCHIVED";
    a.statusReason="复核确认已被更新的资产替代（"+TODAY+"，"+ME+"）。";
    toast(`${id} 已归档。`);
  }
  delete REVIEW_META[id];
  route();
}

        <div><div class="bigv" style="color:var(--warn)">${ASSETS.filter(a=>a.status==="REVIEW_DUE").length}</div><div class="footnote">REVIEW-DUE 积压<br>（目标 ≤ 5，超限报警）</div></div>

/* ================= 路由 ================= */
const NAV=[
  {h:"#/",ic:"⌕",t:"首页 · 搜索",match:p=>p===""||p==="search"},
  {h:"#/ask",ic:"◈",t:"AI 问答",match:p=>p==="ask"},
  {h:"#/capture",ic:"＋",t:"沉淀记录",match:p=>p==="capture"},
  {h:"#/review",ic:"！",t:"复核队列",match:p=>p==="review",badge:()=>ASSETS.filter(a=>a.status==="REVIEW_DUE").length},
  {h:"#/dash",ic:"▤",t:"数据看板",match:p=>p==="dash"}
];
function renderNav(page){
  $("#nav").innerHTML=NAV.map(n=>{
    const b=n.badge?n.badge():0;
    return `<a href="${n.h}" class="${n.match(page)?"on":""}"><span class="ic">${n.ic}</span>${n.t}${b?`<span class="bdg">${b}</span>`:""}</a>`;
  }).join("");
}
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const [pathPart,queryPart]=h.split("?");
  const page=pathPart.split("/")[0];
  const p=new URLSearchParams(queryPart||"");
  let html="";
  if(page==="search"){
    searchState={q:p.get("q")||"",type:p.get("type")||"",model:p.get("model")||"",fw:p.get("fw")||"",status:p.get("status")||"",hist:p.get("hist")==="1"};
    html=renderSearch(searchState);
  }
  else if(page==="ask") html=renderAsk();
  else if(page==="asset") html=renderAsset(pathPart.split("/")[1]);
  else if(page==="capture") html=renderCapture();
  else if(page==="review") html=renderReview();
  else if(page==="dash") html=renderDash();
  else html=renderHome();
  renderNav(page);
  $("#main").innerHTML=html;
  $("#main").scrollTop=0; window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
